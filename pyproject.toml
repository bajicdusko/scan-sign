[project]
name = "scan-sign"
version = "0.1.0"
description = "Place a signature and stamp onto a PDF, with an optional scanned look"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dusko Bajic", email = "bajicdusko@gmail.com" }]
keywords = ["pdf", "signature", "stamp", "scan", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = ["pymupdf>=1.24", "pillow>=10", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/bajicdusko/scan-sign"
Issues = "https://github.com/bajicdusko/scan-sign/issues"

[project.scripts]
scan-sign = "scan_sign.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scan_sign", "scan_sign.webpicker"]

[tool.setuptools.package-data]
"scan_sign.webpicker" = ["index.html"]
